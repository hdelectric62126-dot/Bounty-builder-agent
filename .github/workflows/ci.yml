name: Application CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run the complete test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DATA_DIR: ${{ runner.temp }}/bounty-builder-data
        run: |
          mkdir -p "$DATA_DIR"
          python -m unittest discover -s tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit pinned production dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --requirement requirements.txt --strict
